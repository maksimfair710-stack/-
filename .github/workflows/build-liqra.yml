name: Build LIQRA Android (AyuGram)

on:
  workflow_dispatch:
  push:
    branches:
      - liqra-android-ayugram
    paths:
      - "LIQRA-Android/**"
      - ".github/workflows/build-liqra.yml"

permissions:
  contents: read

concurrency:
  group: liqra-android-ayugram-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build LIQRA APK from AyuGram4A
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout LIQRA build configuration
        uses: actions/checkout@v5

      - name: Validate Telegram API secrets
        env:
          LIQRA_API_ID: ${{ secrets.LIQRA_API_ID }}
          LIQRA_API_HASH: ${{ secrets.LIQRA_API_HASH }}
        run: |
          test -n "$LIQRA_API_ID" || { echo "::error::Missing repository secret LIQRA_API_ID"; exit 1; }
          test -n "$LIQRA_API_HASH" || { echo "::error::Missing repository secret LIQRA_API_HASH"; exit 1; }
          case "$LIQRA_API_ID" in *[!0-9]*) echo "::error::LIQRA_API_ID must be numeric"; exit 1;; esac

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Bootstrap Android SDK command-line tools
        run: |
          SDK_ROOT="$RUNNER_TEMP/android-sdk"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          curl -fL --retry 3 "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o "$RUNNER_TEMP/android-cmdline-tools.zip"
          mkdir -p "$RUNNER_TEMP/android-cmdline-tools"
          unzip -q "$RUNNER_TEMP/android-cmdline-tools.zip" -d "$RUNNER_TEMP/android-cmdline-tools"
          mv "$RUNNER_TEMP/android-cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Install AyuGram Android toolchain
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager \
            "platforms;android-33" \
            "build-tools;33.0.1" \
            "platform-tools" \
            "ndk;21.4.7075529" \
            "cmake;3.10.2.4988404"

      - name: Clone official open-source AyuGram4A base (without private submodule)
        env:
          AYUGRAM_COMMIT: "7013145676d36d82ee13c02a89f72097b7490dcd"
        run: |
          git clone --filter=blob:none https://github.com/AyuGram/AyuGram4A.git "$RUNNER_TEMP/LIQRA-Android"
          git -C "$RUNNER_TEMP/LIQRA-Android" fetch --depth 1 origin "$AYUGRAM_COMMIT"
          git -C "$RUNNER_TEMP/LIQRA-Android" checkout --detach "$AYUGRAM_COMMIT"
          echo "AyuGram source commit: $(git -C "$RUNNER_TEMP/LIQRA-Android" rev-parse HEAD)"

      - name: Apply LIQRA identity and open-source compatibility layer
        env:
          LIQRA_API_ID: ${{ secrets.LIQRA_API_ID }}
          LIQRA_API_HASH: ${{ secrets.LIQRA_API_HASH }}
        run: |
          bash LIQRA-Android/patch-ayugram.sh "$RUNNER_TEMP/LIQRA-Android"
          mkdir -p "$RUNNER_TEMP/LIQRA-Android"
          cat > "$RUNNER_TEMP/LIQRA-Android/API_KEYS" <<EOF
          APP_ID = $LIQRA_API_ID
          APP_HASH = "$LIQRA_API_HASH"
          MAPS_V2_API = ""
          EOF

      - name: Build universal debug APK
        working-directory: ${{ runner.temp }}/LIQRA-Android
        run: |
          chmod +x ./gradlew
          ./gradlew :TMessagesProj:assembleAfatDebug --no-daemon --stacktrace

      - name: Verify APK output
        working-directory: ${{ runner.temp }}/LIQRA-Android
        run: |
          find TMessagesProj/build/outputs/apk -type f -name '*.apk' -print
          test -n "$(find TMessagesProj/build/outputs/apk -type f -name '*.apk' -print -quit)" || {
            echo "::error::Gradle completed without producing an APK"
            exit 1
          }

      - name: Upload LIQRA APK
        uses: actions/upload-artifact@v4
        with:
          name: LIQRA-AyuGram-Android-debug
          path: ${{ runner.temp }}/LIQRA-Android/TMessagesProj/build/outputs/apk/afat/debug/*.apk
          if-no-files-found: error
          retention-days: 14
